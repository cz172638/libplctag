# Host test: Zephyr sockets offloaded to the host Linux stack (NSOS),
# so the sample can talk to libplctag's ab_server on 127.0.0.1.
CONFIG_ETH_DRIVER=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=262144
