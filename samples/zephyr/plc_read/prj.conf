# libplctag
CONFIG_LIBPLCTAG=y

# networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETPAIR=y
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_MAX_CONN=10
CONFIG_ZVFS_OPEN_MAX=24
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=8192

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.50"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"
CONFIG_NET_CONFIG_INIT_TIMEOUT=10

# memory: libplctag thread stacks come from the kernel heap,
# tags/buffers from libc malloc
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_MAIN_STACK_SIZE=8192
# tickler + refcount cleanup + one handler per PLC connection
CONFIG_POSIX_THREAD_THREADS_MAX=8
CONFIG_ENTROPY_GENERATOR=y

CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_PRINTK=y
